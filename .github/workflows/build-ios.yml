name: CI & iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS for native TypeScript type stripping)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (27/27)
        run: npm test

      - name: Ensure Expo Environment Types
        run: test -f expo-env.d.ts || echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

  build-ios-simulator:
    name: Build iOS Simulator (.app)
    needs: test
    # Expo SDK 57 的 expo-modules-jsi 必须用 Xcode 26.4+（Swift 6.3）从源码编译；
    # macos-15 镜像最高只自带 Xcode 26.3（Swift 6.2，存在 Swift/C++ interop 编译器回归，
    # 会在 RuntimeScheduler.h 报 SWIFT_RETURNS_RETAINED 错误），因此必须使用 macos-26 镜像。
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode (26.6 — Expo SDK 57 requires Xcode 26.4+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 显式钉版本，避免 latest-stable 漂移到不兼容版本重蹈覆辙
          xcode-version: '26.6'

      - name: Verify Xcode Version (require 26.4+)
        run: |
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | awk '/Xcode/{print $2}')
          echo "Selected Xcode version: $XCODE_VERSION"
          # expo-modules-jsi 在 Xcode 26.0-26.3 (Swift 6.2) 下编译必失败，26.4 (Swift 6.3) 起修复
          if [ "$(printf '%s\n%s\n' '26.4' "$XCODE_VERSION" | sort -V | head -n1)" != '26.4' ]; then
            echo "ERROR: Expo SDK 57 requires Xcode 26.4+ (Swift 6.3), but got $XCODE_VERSION"
            exit 1
          fi

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods Dependencies
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
        run: |
          node -e '
            const fs = require("fs");
            const p = "ios/Podfile.properties.json";
            const json = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, "utf8")) : {};
            json["EXPO_USE_PRECOMPILED_MODULES"] = "false";
            fs.writeFileSync(p, JSON.stringify(json, null, 2));
            console.log("Updated ios/Podfile.properties.json:", json);
          '
          cd ios
          pod install

      - name: Build for iOS Simulator (Release)
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
        run: |
          set -o pipefail
          echo "=== Content of ios directory ==="
          ls -la ios
          # 精准选取顶层 CocoaPods 聚合 workspace（绝不能使用 xcodeproj 内部的 project.xcworkspace）
          XCWORKSPACE="ios/AgentReminder.xcworkspace"
          if [ ! -d "$XCWORKSPACE" ]; then
            XCWORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          fi
          if [ -z "$XCWORKSPACE" ] || [ ! -d "$XCWORKSPACE" ]; then
            echo "ERROR: CocoaPods workspace not found in ios directory!"
            exit 1
          fi
          echo "Selected CocoaPods workspace: $XCWORKSPACE"

          sudo ln -sf "$(which node)" /usr/local/bin/node || true

          # 使用 Node.js 跨平台禁用 parallelizeBuildables，避免 macOS BSD sed 语法差异
          node -e '
            const fs = require("fs");
            const path = require("path");
            function patchSchemes(dir) {
              if (!fs.existsSync(dir)) return;
              for (const item of fs.readdirSync(dir)) {
                const full = path.join(dir, item);
                if (fs.statSync(full).isDirectory()) patchSchemes(full);
                else if (item.endsWith(".xcscheme")) {
                  let c = fs.readFileSync(full, "utf8");
                  if (c.includes("parallelizeBuildables = \"YES\"")) {
                    c = c.replace(/parallelizeBuildables = \"YES\"/g, "parallelizeBuildables = \"NO\"");
                    fs.writeFileSync(full, c, "utf8");
                    console.log("Patched parallelizeBuildables in", full);
                  }
                }
              }
            }
            patchSchemes("ios");
          '

          echo "=== Building workspace: $XCWORKSPACE for AgentReminder on iOS Simulator ==="
          xcodebuild \
            -workspace "$XCWORKSPACE" \
            -scheme AgentReminder \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: ERRORS BELOW ===================="
              grep -E 'error: |fatal error: |FAILED' xcodebuild.log | head -n 40 || tail -n 60 xcodebuild.log
              echo "==================================================================="
              echo "### ❌ iOS Simulator Build Failed" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -E 'error: |fatal error: |FAILED' xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY || tail -n 30 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package App for Distribution
        run: |
          mkdir -p dist
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found app at: $APP_PATH"
          tar -czf dist/AgentReminder-iOS-Simulator.tar.gz -C "$(dirname "$APP_PATH")" "$APP_NAME"

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentReminder-iOS-Simulator
          path: dist/AgentReminder-iOS-Simulator.tar.gz
          retention-days: 14

      - name: Report Build Success
        if: success()
        run: |
          echo "### 🎉 Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "AgentReminder iOS Simulator build completed successfully. Artifact is ready for download." >> $GITHUB_STEP_SUMMARY
