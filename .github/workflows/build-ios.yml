name: CI & iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS for native TypeScript type stripping)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (27/27)
        run: npm test

      - name: Ensure Expo Environment Types
        run: test -f expo-env.d.ts || echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

  build-ios-simulator:
    name: Build iOS Simulator (.app)
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode (Latest Stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods Dependencies
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
        run: |
          node -e '
            const fs = require("fs");
            const p = "ios/Podfile.properties.json";
            const json = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, "utf8")) : {};
            json["EXPO_USE_PRECOMPILED_MODULES"] = "false";
            fs.writeFileSync(p, JSON.stringify(json, null, 2));
            console.log("Updated ios/Podfile.properties.json:", json);
          '
          cd ios
          pod install

      - name: Build for iOS Simulator (Release)
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
        run: |
          set -o pipefail
          echo "=== Content of ios directory ==="
          ls -la ios
          XCWORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          if [ -z "$XCWORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi
          echo "Building workspace: $XCWORKSPACE for AgentReminder on iOS Simulator..."

          sudo ln -sf "$(which node)" /usr/local/bin/node || true

          xcodebuild \
            -workspace "$XCWORKSPACE" \
            -scheme AgentReminder \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: ERRORS BELOW ===================="
              grep -E 'error: |fatal error: |FAILED' xcodebuild.log | head -n 40 || tail -n 60 xcodebuild.log
              echo "==================================================================="
              echo "### ❌ iOS Simulator Build Failed" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -E 'error: |fatal error: |FAILED' xcodebuild.log | head -n 30 >> $GITHUB_STEP_SUMMARY || tail -n 30 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package App for Distribution
        run: |
          mkdir -p dist
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found app at: $APP_PATH"
          tar -czf dist/AgentReminder-iOS-Simulator.tar.gz -C "$(dirname "$APP_PATH")" "$APP_NAME"

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentReminder-iOS-Simulator
          path: dist/AgentReminder-iOS-Simulator.tar.gz
          retention-days: 14

      - name: Report Build Success
        if: success()
        run: |
          echo "### 🎉 Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "AgentReminder iOS Simulator build completed successfully. Artifact is ready for download." >> $GITHUB_STEP_SUMMARY
