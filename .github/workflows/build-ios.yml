name: CI & iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS for native TypeScript type stripping)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (27/27)
        run: npm test

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

  build-ios-simulator:
    name: Build iOS Simulator (.app)
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build for iOS Simulator (Release)
        run: |
          XCWORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          XCSCHEME=$(xcodebuild -list -json -workspace "$XCWORKSPACE" | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0));
            const schemes = data.workspace ? data.workspace.schemes : (data.project ? data.project.schemes : []);
            console.log(schemes[0] || "1");
          ')
          echo "Building workspace: $XCWORKSPACE, scheme: $XCSCHEME"
          xcodebuild \
            -workspace "$XCWORKSPACE" \
            -scheme "$XCSCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App for Distribution
        run: |
          mkdir -p dist
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          echo "Found app at: $APP_PATH"
          tar -czf dist/AgentReminder-iOS-Simulator.tar.gz -C "$(dirname "$APP_PATH")" "$APP_NAME"

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentReminder-iOS-Simulator
          path: dist/AgentReminder-iOS-Simulator.tar.gz
          retention-days: 14
